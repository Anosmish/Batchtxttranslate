<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Text Translator</title>
<style>
  body { font-family: Arial, sans-serif; background: #f9f9f9; padding: 20px; }
  h1 { text-align: center; }
  #dropArea {
    border: 2px dashed #aaa; border-radius: 5px;
    padding: 20px; text-align: center; margin-bottom: 10px; background: #fff;
    cursor: pointer;
  }
  #dropArea.hover { border-color: #333; }
  select, button { padding: 10px; font-size: 16px; margin: 5px 0; }
  #status { margin-top: 10px; font-weight: bold; }
  #history { margin-top: 20px; background: #fff; padding: 10px; border-radius: 5px; max-height: 200px; overflow-y: auto; }
  .batch-item { border-bottom: 1px solid #ddd; padding: 5px; }
</style>
</head>
<body>

<h1>Batch Text Translator</h1>

<div id="dropArea">Drop your text file here or click to select</div>
<input type="file" id="fileInput" accept=".txt" style="display:none;" />

<br>
<select id="languageSelect">
  <option value="en">English</option>
  <option value="hi">Hindi</option>
  <option value="es">Spanish</option>
  <option value="fr">French</option>
  <option value="de">German</option>
</select>
<button id="translateBtn">Translate & Download</button>

<div id="status"></div>

<div id="history">
  <h3>Last 30 minutes translations:</h3>
  <div id="historyContent"></div>
</div>

<script>
const backendUrl = "https://batchtxttranslate.onrender.com"; // Change if needed
let selectedFile = null;

const dropArea = document.getElementById("dropArea");
const fileInput = document.getElementById("fileInput");
const translateBtn = document.getElementById("translateBtn");
const statusDiv = document.getElementById("status");

// Drag & drop events
dropArea.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropArea.classList.add("hover");
});

dropArea.addEventListener("dragleave", (e) => {
  e.preventDefault();
  dropArea.classList.remove("hover");
});

dropArea.addEventListener("drop", (e) => {
  e.preventDefault();
  dropArea.classList.remove("hover");
  if (e.dataTransfer.files.length) {
    selectedFile = e.dataTransfer.files[0];
    dropArea.innerText = `Selected: ${selectedFile.name}`;
  }
});

dropArea.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", (e) => {
  if (fileInput.files.length) {
    selectedFile = fileInput.files[0];
    dropArea.innerText = `Selected: ${selectedFile.name}`;
  }
});

// Translate & Download
translateBtn.addEventListener("click", async () => {
  if (!selectedFile) {
    alert("Please select a text file first.");
    return;
  }

  const language = document.getElementById("languageSelect").value;
  const formData = new FormData();
  formData.append("file", selectedFile);
  formData.append("language", language);

  statusDiv.innerText = "Translating...";

  try {
    const response = await fetch(`${backendUrl}/translate`, {
      method: "POST",
      body: formData
    });

    const data = await response.json();

    if (data.download_url) {
      const link = document.createElement("a");
      link.href = `${backendUrl}${data.download_url}`;
      link.download = data.download_name || "translated_batches.zip";
      document.body.appendChild(link);
      link.click();
      link.remove();
      statusDiv.innerText = "Translation complete! Download should start.";
    } else {
      statusDiv.innerText = "Error: " + (data.error || "Unknown error");
    }

    // Show last 30 min history if available
    if (data.history_texts) {
      const historyDiv = document.getElementById("historyContent");
      historyDiv.innerHTML = "";
      data.history_texts.forEach((batch, idx) => {
        const div = document.createElement("div");
        div.className = "batch-item";
        div.textContent = `Batch ${idx + 1}: ${batch.substring(0,200)}...`;
        historyDiv.appendChild(div);
      });
    }

  } catch (err) {
    console.error(err);
    statusDiv.innerText = "Translation failed. Check console for error.";
  }
});
</script>

</body>
</html>
